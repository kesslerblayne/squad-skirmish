const wpick=w=>{let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return w.length-1};

function genName(){const have=new Set(U.players.map(p=>p.name.toLowerCase()));for(let i=0;i<800;i++){const sw=()=>{let x;do{x=rw()}while(x.length>6);return x},n=Math.random()<.5?(Math.random()<.9?rw().toLowerCase():cap(rw())):(Math.random()<.9?cap(sw())+cap(sw()):(sw()+sw()).toLowerCase());if(!have.has(n.toLowerCase()))return n}return cap(rw())+rw()+d(99)}
function genRegions(n){const out=[],used=new Set(),suf=['land','reach','mark','shire','ia','heim','fall','vale','ridge','coast'];while(out.length<n){const nm=cap(rw())+pk(suf);if(used.has(nm))continue;used.add(nm);out.push({id:'rg'+Math.random().toString(36).slice(2,8),name:nm})}return out}

function promoDemo(){const R=desir(),out=[];U.teams.filter(a=>a.ac&&!a.def).forEach(a=>{const m=U.teams.find(x=>x.id==a.ac);if(!m||m.def||!m.org||m.org!=a.org)return;const ok=(t,p)=>p&&!p.ret&&p.ct&&!p.ct.exp&&p.ct.tid==t.id&&R[p.id];
 for(let i=0;i<5;i++){const up=a.pids.map(id=>U.players.find(x=>x.id==id)).filter(p=>ok(a,p)).sort((x,y)=>R[x.id].rank-R[y.id].rank)[0],dn=m.pids.map(id=>U.players.find(x=>x.id==id)).filter(p=>ok(m,p)).sort((x,y)=>R[y.id].rank-R[x.id].rank)[0];
  if(!up||!dn||R[up.id].rank>=R[dn.id].rank)break;
  a.pids=a.pids.filter(x=>x!=up.id);m.pids=m.pids.filter(x=>x!=dn.id);delete a.roles[up.id];delete m.roles[dn.id];m.pids.push(up.id);a.pids.push(dn.id);up.ct.tid=m.id;dn.ct.tid=a.id;
  const pc=p=>Math.round(100*(1-R[p.id].rank/Object.keys(R).length));
  out.push(up.name+' promoted to '+m.name+' (top '+(100-pc(up))+'%), '+dn.name+' demoted to '+a.name);post('insider',up.name+' promoted to '+m.name+', '+dn.name+' moves down to '+a.name+'. 🔁',nowN())}});return out}

function tyStep(i){i=[0,2,3,4,1][i];const n=(U.year-1)*350;
 if(i==0){U.teams.forEach(t=>{if(t.def)return;const ps=t.pids.map(k=>U.players.find(x=>x.id==k)).filter(Boolean);if(ps.length)(t.eh=t.eh||[]).push({y:U.year,a:Math.round(ps.reduce((a,p)=>a+(p.elo??100),0)/ps.length*10)/10})});U.teams.filter(t=>t.fr&&!t.def).forEach(t=>t.prev=t.pids.slice());U.today=U.year*350-1;U.year++;TYS={ex:[],ch:[],ro:[],rt:[],pd:[]};U.players.forEach(p=>{if(p.ret||!p.ct||p.ct.exp)return;if(--p.ct.yrs<=0){p.ct.exp=true;TYS.ex.push([p,tn(p.ct.tid)])}});U.orgs.forEach(o=>{if(!o.def&&U.year-(o.my||1)>=5){o.money=Math.max(-2,Math.min(2,(o.money||0)+d(3)-2));o.my=U.year}});TYS.ex.forEach(([p,t])=>post('insider',p.name+"'s contract with "+t+' is up. will they re-sign? 👀',(U.year-1)*350));return'Year '+(U.year-1)+' is closed. It is now Year '+U.year+'. '+TYS.ex.length+' contract'+(TYS.ex.length==1?'':'s')+' expired.'+(()=>{const t=safe('trim old seasons',trimOld);if(Date.now()-(meta().last||0)>864e5)setMeta({force:1});return t&&(t.logs||t.posts)?' Trimmed old seasons: '+t.logs+' replay logs and '+t.posts+' old posts.':''})()}
 if(i==1){TYS.ch=[];U.players.filter(p=>!p.ret&&p.rkY!==U.year).forEach(p=>{p.age++;if(p.age>=28)p.pot=Math.max(-9,p.pot-(p.age>=33?2:1));const th=Math.min(95,Math.abs(p.pot)*10);let c=0;for(let k=0;k<60&&th&&d(100)<=th;k++)c+=p.pot>0?1:-1;p.sk=Math.max(1,p.sk+c);(p.hist=p.hist||[]).push({y:U.year,age:p.age,sk:p.sk,pot:p.pot,ch:c,elo:p.elo??100});TYS.ch.push([p,c])});pulseProg(TYS.ch,n);return TYS.ch.length+' players aged a year and rolled progression.'}
